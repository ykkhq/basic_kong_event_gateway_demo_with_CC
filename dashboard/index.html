<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kong Event Gateway — Orders Demo</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#0b0f14; --panel:#121924; --panel-border:#22303f;
    --text:#e7edf3; --muted:#8ea3b8;
    --us:#f2994a; --eu:#4a9df2; --kong:#5ee6a6; --kafka:#4a9df2;
    --test:#c77dff; --prod:#34d399; --skip:#ef5b6b;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:20px 20px 40px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:13px}
  .wrap{max-width:1150px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:14px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card .value{font-size:26px;font-weight:600;margin-top:4px}
  .card.us .value{color:var(--us)} .card.eu .value{color:var(--eu)}
  .card.test .value{color:var(--test)} .card.prod .value{color:var(--prod)}
  .card.skip .value{color:var(--skip)} .card.ok .value{color:var(--kong)}
  .diagram{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:10px;overflow-x:auto}
  svg{display:block;min-width:980px;width:100%}
  .node-box{fill:#182233;stroke:var(--panel-border);stroke-width:1}
  .node-label{fill:var(--text);font-size:12px;font-weight:600}
  .node-sub{fill:var(--muted);font-size:10px}
  .kong-box{fill:#10241c;stroke:var(--kong);stroke-width:1.5}
  .kafka-box{fill:#0f1c2b;stroke:var(--kafka);stroke-width:1.5}
  .vc-box{fill:#182b22;stroke:var(--kong);stroke-width:1}
  .topic-box{fill:#182233;stroke:var(--kafka);stroke-width:1}
  .path{fill:none;stroke:#2a3a4d;stroke-width:1.5}
  .dot{r:4}
  .dot.us{fill:var(--us)} .dot.eu{fill:var(--eu)}
  .dot.test{fill:var(--test)} .dot.prod{fill:var(--prod)} .dot.skip{fill:var(--skip)}
  .flash{animation:flashPulse 650ms ease-out}
  @keyframes flashPulse{
    0%{filter:brightness(2.1) saturate(1.6) drop-shadow(0 0 10px #ffb454);}
    100%{filter:brightness(1) saturate(1) drop-shadow(0 0 0px transparent);}
  }
  .flash-skip{animation:flashPulseSkip 650ms ease-out}
  @keyframes flashPulseSkip{
    0%{filter:brightness(2.1) saturate(1.8) drop-shadow(0 0 10px #ef5b6b);}
    100%{filter:brightness(1) saturate(1) drop-shadow(0 0 0px transparent);}
  }
  .skip-label{fill:var(--skip);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:opacity 200ms ease}
  .log{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:10px 14px;margin-top:20px;max-height:180px;overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .log div{padding:2px 0;color:var(--muted)}
  .log .us{color:var(--us)} .log .eu{color:var(--eu)}
  .log .test{color:var(--test)} .log .prod{color:var(--prod)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kong Event Gateway — Multi-Region Orders</h1>
  <p class="sub">every client — producer or consumer — talks only to Kong Event Gateway; Kafka sits behind it</p>

  <div class="cards">
    <div class="card us"><div class="label">Produced US</div><div class="value" id="c-prod-us">0</div></div>
    <div class="card eu"><div class="label">Produced EU</div><div class="value" id="c-prod-eu">0</div></div>
    <div class="card ok"><div class="label">Analytics received (all)</div><div class="value" id="c-analytics">0</div></div>
    <div class="card test"><div class="label">Test consumer (test only)</div><div class="value" id="c-test">0</div></div>
    <div class="card prod"><div class="label">Prod consumer (prod only)</div><div class="value" id="c-prodc">0</div></div>
    <div class="card skip"><div class="label">Skipped for test / prod</div><div class="value" id="c-skip">0 / 0</div></div>
  </div>

  <div class="diagram">
    <svg viewBox="0 0 1000 460" id="svg">
      <!-- producers (left) -->
      <g><rect id="box-in-us" class="node-box" x="15" y="30" width="175" height="48" rx="8"/><text class="node-label" x="27" y="50">Producer · US</text><text class="node-sub" x="27" y="66">1 msg / 1-5s</text></g>
      <g><rect id="box-in-eu" class="node-box" x="15" y="100" width="175" height="48" rx="8"/><text class="node-label" x="27" y="120">Producer · EU</text><text class="node-sub" x="27" y="136">~20% tagged "test"</text></g>

      <!-- consumers (right) -->
      <g><rect id="box-analytics" class="node-box" x="810" y="20" width="175" height="48" rx="8"/><text class="node-label" x="822" y="40">Analytics consumer</text><text class="node-sub" x="822" y="56">sees everything</text></g>
      <g><rect id="box-test" class="node-box" x="810" y="90" width="175" height="48" rx="8"/><text class="node-label" x="822" y="110">Test consumer</text><text class="node-sub" x="822" y="126">condition = test</text></g>
      <g><rect id="box-prod" class="node-box" x="810" y="160" width="175" height="48" rx="8"/><text class="node-label" x="822" y="180">Prod consumer</text><text class="node-sub" x="822" y="196">condition = prod</text></g>

      <!-- Kong Event Gateway: on top, virtual clusters live inside it -->
      <g>
        <rect class="kong-box" x="250" y="15" width="500" height="150" rx="12"/>
        <text class="node-label" x="270" y="35" style="fill:#5ee6a6;font-size:13px">Kong Event Gateway</text>
        <rect id="box-vc-orders" class="vc-box" x="265" y="55" width="150" height="95" rx="8"/>
        <text class="node-label" x="278" y="80">orders-vc</text>
        <text class="node-sub" x="278" y="98">alias "orders" routed</text>
        <text class="node-sub" x="278" y="112">by principal</text>
        <rect id="box-vc-test" class="vc-box" x="425" y="55" width="140" height="95" rx="8"/>
        <text class="node-label" x="450" y="80">test-vc</text>
        <text class="node-sub" x="438" y="98">skip_record:</text>
        <text class="node-sub" x="438" y="112">condition != test</text>
        <text id="lbl-skip-test" class="skip-label" x="495" y="143" text-anchor="middle" opacity="0">skipped</text>
        <rect id="box-vc-prod" class="vc-box" x="575" y="55" width="155" height="95" rx="8"/>
        <text class="node-label" x="608" y="80">prod-vc</text>
        <text class="node-sub" x="588" y="98">skip_record:</text>
        <text class="node-sub" x="588" y="112">condition != prod</text>
        <text id="lbl-skip-prod" class="skip-label" x="653" y="143" text-anchor="middle" opacity="0">skipped</text>
      </g>

      <!-- Kafka: beneath Kong, topics live inside it -->
      <g>
        <rect class="kafka-box" x="250" y="210" width="500" height="150" rx="12"/>
        <text class="node-label" x="270" y="232" style="fill:#4a9df2;font-size:13px">Kafka · Confluent Cloud</text>
        <rect id="box-topic-us" class="topic-box" x="290" y="250" width="190" height="90" rx="8"/>
        <text class="node-label" x="305" y="285">orders.us</text>
        <rect id="box-topic-eu" class="topic-box" x="520" y="250" width="190" height="90" rx="8"/>
        <text class="node-label" x="535" y="285">orders.eu</text>
      </g>

      <!-- clients -> virtual clusters -->
      <path class="path" id="p-in-analytics" d="M810,44 C900,0 350,0 400,55"/>
      <path class="path" id="p-in-us" d="M190,54 C220,54 240,80 265,80"/>
      <path class="path" id="p-in-eu" d="M190,124 C220,124 240,120 265,120"/>
      <path class="path" id="p-in-test" d="M810,114 C700,114 650,90 565,90"/>
      <path class="path" id="p-in-prod" d="M810,184 C770,184 750,120 730,120"/>

      <!-- virtual clusters -> topics: one line per produce, one per consume -->
      <path class="path" id="p-produce-us" d="M300,150 C300,180 320,220 320,250"/>
      <path class="path" id="p-produce-eu" d="M380,150 C380,180 540,220 540,250"/>
      <path class="path" id="p-consume-analytics-us" d="M330,150 C330,180 360,220 360,250"/>
      <path class="path" id="p-consume-analytics-eu" d="M400,150 C400,180 580,220 580,250"/>
      <path class="path" id="p-consume-test-us" d="M460,150 C460,180 410,220 410,250"/>
      <path class="path" id="p-consume-test-eu" d="M520,150 C520,180 630,220 630,250"/>
      <path class="path" id="p-consume-prod-us" d="M590,150 C590,180 450,220 450,250"/>
      <path class="path" id="p-consume-prod-eu" d="M680,150 C680,180 680,220 680,250"/>
    </svg>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const paths = {
  in_us: $("p-in-us"), in_eu: $("p-in-eu"),
  in_analytics: $("p-in-analytics"), in_test: $("p-in-test"), in_prod: $("p-in-prod"),
  produce_us: $("p-produce-us"), produce_eu: $("p-produce-eu"),
  consume_analytics_us: $("p-consume-analytics-us"), consume_analytics_eu: $("p-consume-analytics-eu"),
  consume_test_us: $("p-consume-test-us"), consume_test_eu: $("p-consume-test-eu"),
  consume_prod_us: $("p-consume-prod-us"), consume_prod_eu: $("p-consume-prod-eu"),
};
const svg = $("svg");

function flash(id, cls="flash"){
  const el = $(id);
  if (!el) return;
  el.classList.remove("flash", "flash-skip");
  void el.getBBox();
  el.classList.add(cls);
}

function showSkipLabel(id){
  const el = $(id);
  if (!el) return;
  el.setAttribute("opacity", "1");
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => el.setAttribute("opacity", "0"), 700);
}

function fly(path, cls, duration=1100, reverse=false){
  return new Promise((resolve) => {
    const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("class", "dot " + cls);
    svg.appendChild(dot);
    const len = path.getTotalLength();
    const start = performance.now();
    function step(now){
      const raw = Math.min((now - start) / duration, 1);
      const t = reverse ? 1 - raw : raw;
      const pt = path.getPointAtLength(t * len);
      dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
      if (raw < 1) requestAnimationFrame(step); else { dot.remove(); resolve(); }
    }
    requestAnimationFrame(step);
  });
}

// Animations are queued and run one at a time, so dots move sequentially
// across the diagram instead of several overlapping mid-flight.
const animQueue = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function runQueue(){
  while (true){
    if (animQueue.length === 0){ await wait(60); continue; }
    await animQueue.shift()();
  }
}
runQueue();

let lastSeen = 0;
function logLine(text, cls){
  const div = document.createElement("div");
  div.className = cls || "";
  div.textContent = text;
  const log = $("log");
  log.prepend(div);
  while (log.children.length > 40) log.removeChild(log.lastChild);
}

async function tick(){
  try {
    const res = await fetch("/state");
    const s = await res.json();
    $("c-prod-us").textContent = s.produced.us;
    $("c-prod-eu").textContent = s.produced.eu;
    $("c-analytics").textContent = s.analytics_total;
    $("c-test").textContent = s.consumed.test.test;
    $("c-prodc").textContent = s.consumed.prod.prod;
    $("c-skip").textContent = `${s.skipped_for_test} / ${s.skipped_for_prod}`;
    if (s.leaked_to_test > 0 || s.leaked_to_prod > 0) {
      $("c-skip").style.color = "var(--skip)";
      $("c-skip").textContent += "  ⚠ LEAK";
    }

    for (const ev of s.recent){
      if (ev.ts <= lastSeen) continue;
      lastSeen = Math.max(lastSeen, ev.ts);
      const region = (ev.region || "").toLowerCase();
      const condition = (ev.condition || "").toLowerCase();
      if (ev.type === "produced"){
        animQueue.push(async () => {
          // client -> orders-vc
          await fly(region === "us" ? paths.in_us : paths.in_eu, region);
          flash("box-vc-orders");
          // orders-vc -> the physical topic it routed to
          await fly(region === "us" ? paths.produce_us : paths.produce_eu, region, 900);
          flash(region === "us" ? "box-topic-us" : "box-topic-eu");

          // the "other" virtual cluster also reads this record from the topic,
          // then its skip_record policy drops it before it reaches that consumer
          const skipVc = condition === "test" ? "prod" : "test";
          const skipPath = paths["consume_" + skipVc + "_" + region];
          if (skipPath) {
            await fly(skipPath, "skip", 900, true);
            flash("box-vc-" + skipVc, "flash-skip");
            showSkipLabel("lbl-skip-" + skipVc);
          }
        });
        logLine(`produced  [${ev.region}/${ev.condition}]  order ${ (ev.order_id||"").slice(0,8) }  $${ev.amount}`, condition);
      } else if (ev.type === "consumed"){
        animQueue.push(async () => {
          // topic -> the consuming virtual cluster (reverse = travels from topic up to VC)
          const consumeKey = "consume_" + ev.persona + "_" + region;
          if (paths[consumeKey]) await fly(paths[consumeKey], ev.persona === "analytics" ? region : condition, 900, true);
          flash(ev.persona === "analytics" ? "box-vc-orders" : ev.persona === "test" ? "box-vc-test" : "box-vc-prod");
          // virtual cluster -> client (reverse of the client-in path)
          const clientPath = ev.persona === "analytics" ? paths.in_analytics
                            : ev.persona === "test" ? paths.in_test
                            : paths.in_prod;
          await fly(clientPath, ev.persona === "analytics" ? region : condition, 1100, true);
          flash(ev.persona === "analytics" ? "box-analytics" : ev.persona === "test" ? "box-test" : "box-prod");
        });
        logLine(`consumed  [${ev.persona}]  ${ev.region}/${ev.condition}  order ${ (ev.order_id||"").slice(0,8) }`, condition);
      }
    }
  } catch (e) { /* server not up yet */ }
  setTimeout(tick, 900);
}
tick();
</script>
</body>
</html>
